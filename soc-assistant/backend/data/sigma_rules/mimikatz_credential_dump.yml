title: Credential Dumping via LSASS Memory Access
id: sigma-0002
description: Detects tools dumping LSASS process memory to extract credentials (Mimikatz-style technique using comsvcs.dll).
status: stable
level: critical
logsource:
  category: process_creation
  product: windows
tags:
  - attack.credential_access
  - attack.t1003.001
detection:
  selection:
    process_name|contains: 'rundll32'
    command_line|contains:
      - 'comsvcs.dll'
      - 'MiniDump'
  condition: selection
